<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connect Four</title>

    <link rel="stylesheet" href="game.css">

    <script type="module" src="game.js"></script>
</head>

<body>

    <main class="game-shell">

        <a class="back-link" href="../../index.html">
            &larr; Back to Games
        </a>

        <h1>Connect Four</h1>

        <p class="instructions">
            Take turns dropping pieces. Connect four in a row to win.
        </p>

        <div class="game-info">
            <p>
                Current Player:
                <strong>
                    Player
                    <span
                        id="current-player"
                        class="player-one-turn"
                    >1</span>
                </strong>
            </p>
        </div>

        <p
            id="game-message"
            class="game-message"
            aria-live="polite"
        >
            Player 1's turn.
        </p>

        <p
            id="result"
            class="result"
            aria-live="polite"
        ></p>

        <div class="session-score">
            <p>
                Player 1 Wins:
                <span id="player-one-wins">0</span>
            </p>

            <p>
                Player 2 Wins:
                <span id="player-two-wins">0</span>
            </p>

            <p>
                Draws:
                <span id="draws">0</span>
            </p>
        </div>

        <div class="game-controls">
            <button id="new-game-button" type="button">
                New Game
            </button>
        </div>

        <div
            class="grid"
            id="board"
            role="grid"
            aria-label="Connect Four board"
        ></div>

    </main>

</body>
</html>
