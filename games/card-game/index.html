<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Card Game</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="game-shell">

        <a class="back-link" href="../../index.html">
            &larr; Back to Games
        </a>

        <h1>Card Game</h1>

        <p class="instructions">
            Draw two cards. The higher card wins the round.
            Aces are high.
        </p>

        <p class="status">
            Status:
            <span id="game-status" aria-live="polite">
                Shuffling deck...
            </span>
        </p>

        <button id="draw-button" type="button" disabled>
            Draw Cards
        </button>

        <section class="scoreboard" aria-label="Game score">

            <div class="score-item">
                <span>Player 1</span>
                <strong id="player1-wins">0</strong>
            </div>

            <div class="score-item">
                <span>Player 2</span>
                <strong id="player2-wins">0</strong>
            </div>

            <div class="score-item">
                <span>Wars</span>
                <strong id="wars">0</strong>
            </div>

            <div class="score-item">
                <span>Rounds</span>
                <strong id="rounds">0</strong>
            </div>

        </section>

        <section class="players">

            <article class="player">
                <h2>Player 1</h2>

                <div class="card-slot">
                    <img
                        id="player1"
                        class="card-image"
                        alt=""
                    >
                </div>
            </article>

            <article class="player">
                <h2>Player 2</h2>

                <div class="card-slot">
                    <img
                        id="player2"
                        class="card-image"
                        alt=""
                    >
                </div>
            </article>

        </section>

        <h3 id="result" aria-live="polite">
            Waiting for the first draw.
        </h3>

    </main>

    <script src="js/main.js"></script>

</body>
</html>
