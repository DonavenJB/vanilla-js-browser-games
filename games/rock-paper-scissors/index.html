<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-shell">

        <a class="back-link" href="../../index.html">
            &larr; Back to Games
        </a>

        <h1>Rock Paper Scissors</h1>

        <p class="instructions">
            Choose rock, paper, or scissors and play against the computer.
        </p>

        <section class="game-status">
            <h2>
                Computer Choice:
                <span id="computer-choice"></span>
            </h2>

            <h2>
                Your Choice:
                <span id="user-choice"></span>
            </h2>

            <h2>
                Results:
                <span id="result"></span>
            </h2>
        </section>

        <section
            class="session-score"
            aria-label="Session score"
        >
            <div class="score-item">
                <span class="score-label">Your Wins</span>
                <strong id="user-wins">0</strong>
            </div>

            <div class="score-item">
                <span class="score-label">Computer Wins</span>
                <strong id="computer-wins">0</strong>
            </div>

            <div class="score-item">
                <span class="score-label">Draws</span>
                <strong id="draws">0</strong>
            </div>

            <div class="score-item">
                <span class="score-label">Rounds</span>
                <strong id="rounds">0</strong>
            </div>
        </section>

        <div class="choices">
            <button id="rock" type="button">
                rock
            </button>

            <button id="paper" type="button">
                paper
            </button>

            <button id="scissors" type="button">
                scissors
            </button>
        </div>

        <div class="session-controls">
            <button
                id="reset-session"
                type="button"
            >
                Reset Session
            </button>
        </div>

    </main>

    <script
        src="js/app.js"
        charset="utf-8"
    ></script>

</body>
</html>
