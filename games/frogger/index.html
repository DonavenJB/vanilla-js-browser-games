<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frogger</title>
    <link rel="stylesheet" type="text/css" href="game.css">
</head>
<body>

    <main class="game-shell">
<a class="back-link" href="../../index.html">&larr; Back to Games</a>
    <h1>Frogger</h1>

    <h3>Seconds left: <span id="time-left">20</span></h3>
    <h3>Result: <span id="result" aria-live="polite"></span></h3>

    <p class="score">
        Wins: <span id="wins">0</span> |
        Losses: <span id="losses">0</span> |
        Games: <span id="games-played">0</span>
    </p>

    <p class="best-time">
        Best Time Left: <span id="best-time">--</span>
    </p>

    <p>Use the arrow keys to reach the goal before time runs out.</p>
    <p>Status: <span id="game-status" aria-live="polite">Ready</span></p>

    <button id="start-pause-button" type="button">Start Game</button>
    <button id="reset-session-button" type="button">New Session</button>

    <div class="direction-controls">
        <button class="move-button up" data-key="ArrowUp" type="button" aria-label="Move up">↑</button>
        <button class="move-button left" data-key="ArrowLeft" type="button" aria-label="Move left">←</button>
        <button class="move-button down" data-key="ArrowDown" type="button" aria-label="Move down">↓</button>
        <button class="move-button right" data-key="ArrowRight" type="button" aria-label="Move right">→</button>
    </div>

    <div class="grid">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div class="ending-block"></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div class="log-left l1"></div>
        <div class="log-left l2"></div>
        <div class="log-left l3"></div>
        <div class="log-left l4"></div>
        <div class="log-left l5"></div>
        <div class="log-left l1"></div>
        <div class="log-left l2"></div>
        <div class="log-left l3"></div>
        <div class="log-left l4"></div>
        <div class="log-right l5"></div>
        <div class="log-right l1"></div>
        <div class="log-right l2"></div>
        <div class="log-right l3"></div>
        <div class="log-right l4"></div>
        <div class="log-right l5"></div>
        <div class="log-right l1"></div>
        <div class="log-right l2"></div>
        <div class="log-right l3"></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div class="car-left c1"></div>
        <div class="car-left c2"></div>
        <div class="car-left c3"></div>
        <div class="car-left c1"></div>
        <div class="car-left c2"></div>
        <div class="car-left c3"></div>
        <div class="car-left c1"></div>
        <div class="car-left c2"></div>
        <div class="car-left c3"></div>
        <div class="car-right c1"></div>
        <div class="car-right c2"></div>
        <div class="car-right c3"></div>
        <div class="car-right c1"></div>
        <div class="car-right c2"></div>
        <div class="car-right c3"></div>
        <div class="car-right c1"></div>
        <div class="car-right c2"></div>

    </main>

    <script src="game.js"></script>
</body>
</html>
