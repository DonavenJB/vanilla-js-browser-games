<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Space Invaders</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-shell">

        <a class="back-link" href="../../index.html">
            &larr; Back to Games
        </a>

        <h1>Space Invaders</h1>

        <p class="instructions">
            Use the left and right arrow keys to move.
            Press the up arrow to fire.
        </p>

        <div class="game-info">
            <p class="score">
                Score:
                <span class="results">0</span>
            </p>

            <p class="remaining">
                Invaders Left:
                <span id="invaders-left">30</span>
            </p>

            <p class="status">
                Status:
                <span id="game-status">Ready</span>
            </p>
        </div>

        <p id="game-message" class="game-message" aria-live="polite">
            Press Start Game to begin.
        </p>

        <div class="controls">
            <button id="start-pause-button" type="button">
                Start Game
            </button>

            <button id="new-game-button" type="button">
                New Game
            </button>
        </div>

        <div class="grid"></div>

    </main>

    <script src="app.js"></script>

</body>
</html>
