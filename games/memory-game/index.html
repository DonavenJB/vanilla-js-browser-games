<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>

    <main class="game-shell">
<a class="back-link" href="../../index.html">&larr; Back to Games</a>

    <h1>Memory Game</h1>

    <div class="stats">
        <h3>Matches: <span id="matches">0</span> / 6</h3>
        <h3>Attempts: <span id="attempts">0</span></h3>
        <h3>Best: <span id="best-attempts">--</span></h3>
    </div>

    <p id="message" aria-live="polite"></p>

    <button id="new-game-button" type="button">New Game</button>

    <div id="grid" role="group" aria-label="Memory card board"></div>

    </main>

    <script type="module" src="game.js"></script>
</body>
</html>
