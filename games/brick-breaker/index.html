<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Brick Breaker</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <main class="game-shell">

        <a
            class="back-link"
            href="../../index.html"
        >
            &larr; Back to Games
        </a>

        <h1>Brick Breaker</h1>

        <p class="instructions">
            Use the left and right arrow keys to move the paddle
            and clear every block.
        </p>

        <div class="game-info">
            <div class="score-panel">
                Score:
                <span id="score">0</span>
            </div>

            <div class="status-panel">
                Status:
                <span
                    id="game-status"
                    aria-live="polite"
                    aria-atomic="true"
                >
                    Ready
                </span>
            </div>
        </div>

        <div class="game-controls">
            <button
                id="game-control"
                type="button"
            >
                Start
            </button>

            <button
                id="new-game"
                type="button"
            >
                New Game
            </button>
        </div>

        <div class="grid"></div>

    </main>

    <script
        type="text/javascript"
        src="js/app.js"
    ></script>

</body>
</html>
