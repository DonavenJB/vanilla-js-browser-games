<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Brick Breaker</title>

    <link
        rel="stylesheet"
        href="game.css"
    >
</head>

<body>

    <main class="game-shell">

        <a
            class="back-link"
            href="../../index.html"
        >
            &larr; Back to Games
        </a>

        <h1>Brick Breaker</h1>

        <p class="instructions">
            Use Left and Right to move the paddle.
            Press Space to start or pause, and N for a new game.
        </p>

        <div class="game-info">
            <div class="score-panel">
                Score:
                <span id="score">0</span>
            </div>

            <div class="status-panel">
                Status:
                <span
                    id="game-status"
                    aria-live="polite"
                    aria-atomic="true"
                >
                    Ready
                </span>
            </div>
        </div>

        <div class="game-controls">
            <button
                id="game-control"
                type="button"
                aria-keyshortcuts="Space"
            >
                Start
            </button>

            <button
                id="new-game"
                type="button"
                aria-keyshortcuts="N"
            >
                New Game
            </button>
        </div>

        <div
            class="grid"
            aria-label="Brick Breaker play field"
        ></div>

        <div
            class="paddle-controls"
            aria-label="Paddle controls"
        >
            <button
                id="paddle-left"
                type="button"
                aria-label="Move paddle left"
                aria-keyshortcuts="ArrowLeft"
            >
                &larr; Left
            </button>

            <button
                id="paddle-right"
                type="button"
                aria-label="Move paddle right"
                aria-keyshortcuts="ArrowRight"
            >
                Right &rarr;
            </button>
        </div>

    </main>

    <script type="module" src="game.js"></script>

</body>
</html>
